import sys
import os
from pathlib import Path
import lit.formats  # type: ignore

if 'PYLINT_IMPORT' in os.environ:
    config = object()
    lit_config = object()

# Utilities
################################################################################

def findFile(path: Path, suffix: str) -> Path:
    filePath = path.joinpath(suffix)
    if not filePath.exists():
        sys.exit("error: '{}' not found at '{}'".format(suffix, path))
    return filePath


# FIXME: I don't like hardcoded paths like this. It'd be better if this
# was more flexible.
testSrcDir = Path(__file__).parent
projectRoot = testSrcDir.parent.parent

buildDir = projectRoot.joinpath("build")

alloyJar = findFile(buildDir, "org.alloytools.alloy.dist.jar")
python = "python3"

genTestModule = "gentest"
checkAlloyModule = "gentest.check_alloy"

default_solver = "sat4j"
solver = lit_config.params.get("solver", default_solver)

# Parameters for benchmarking runs:
bench_args = ""
benchmark_file = lit_config.params.get("benchmark", None)
if benchmark_file is not None:
    bench_args += f"--benchmark={benchmark_file}"
    benchreps = lit_config.params.get("benchreps", None)
    if benchreps is not None:
        bench_args += f" --benchreps={benchreps}"

alloy_flags = f"{bench_args} --solver {solver} --alloy-path {alloyJar}"

# llvm-lit configuration
################################################################################

config.name = "LLVM IR Memory Model"
config.suffixes = [".test", ".als"]
config.test_format = lit.formats.ShTest()
config.test_exec_root = buildDir.joinpath("test", "llvm")
config.test_source_root = testSrcDir

config.substitutions.append(("%alstest", f"cd {projectRoot} && {python} -m {checkAlloyModule} {alloy_flags}"))
config.substitutions.append(("%gentest", f"cd {projectRoot} && {python} -m {genTestModule} --root {projectRoot} {alloy_flags}"))
